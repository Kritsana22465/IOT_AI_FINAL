services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 12

  dashboard:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-iot_dashboard}
      DB_USER: ${POSTGRES_USER:-iot_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
      SNAPSHOT_DIR: /app/data/snapshots
      IMAGE_STORAGE: ${IMAGE_STORAGE:-filesystem}
      REARM_SECONDS: 10
      SENSOR_TIMEOUT_SECONDS: 5
      ARDUINO_API_KEY: ${ARDUINO_API_KEY:-}
      MQTT_HOST: ${MQTT_HOST:-broker.hivemq.com}
      MQTT_PORT: ${MQTT_PORT:-8884}
      MQTT_TRANSPORT: ${MQTT_TRANSPORT:-websockets}
      MQTT_TLS: ${MQTT_TLS:-1}
      MQTT_WS_PATH: ${MQTT_WS_PATH:-/mqtt}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_QUEUE_TOPIC: ${MQTT_QUEUE_TOPIC:-armbot/cmd/queue}
      MQTT_ITEMS_TOPIC: ${MQTT_ITEMS_TOPIC:-armbot/items}
      MQTT_EVENT_TOPIC: ${MQTT_EVENT_TOPIC:-armbot/event}
      MQTT_STATUS_TOPIC: ${MQTT_STATUS_TOPIC:-armbot/status}
      MQTT_RECEIVE_TIMEOUT_SECONDS: ${MQTT_RECEIVE_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
