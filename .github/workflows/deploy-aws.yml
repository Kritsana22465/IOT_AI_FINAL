name: Validate and deploy IoT dashboard to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iot-ai-aws-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Validate Compose files
        shell: bash
        env:
          DOMAIN: example.com
        run: docker compose -f docker-compose.yml -f docker-compose.aws.yml config >/dev/null

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: iot-ai-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: preflight
        shell: bash
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ARDUINO_API_KEY: ${{ secrets.ARDUINO_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_HOST" || -z "$AWS_SSH_PRIVATE_KEY" || -z "$DOMAIN" || -z "$POSTGRES_PASSWORD" || -z "$ARDUINO_API_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AWS deploy secrets are not configured yet; skipping remote deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package application
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=data \
            --exclude=datasetsIOT \
            --exclude=__pycache__ \
            --exclude=.venv \
            -czf "$RUNNER_TEMP/deploy.tar.gz" .

      - name: Configure SSH
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts

      - name: Upload application bundle
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER || 'ec2-user' }}
        run: scp "$RUNNER_TEMP/deploy.tar.gz" "${AWS_USER}@${AWS_HOST}:/tmp/iot-ai-deploy-${GITHUB_SHA}.tar.gz"

      - name: Upload runtime secrets
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER || 'ec2-user' }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ARDUINO_API_KEY: ${{ secrets.ARDUINO_API_KEY }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf 'POSTGRES_DB=iot_dashboard\nPOSTGRES_USER=iot_user\nPOSTGRES_PASSWORD=%s\nARDUINO_API_KEY=%s\nDOMAIN=%s\nMQTT_USERNAME=%s\nMQTT_PASSWORD=%s\n' \
            "$POSTGRES_PASSWORD" "$ARDUINO_API_KEY" "$DOMAIN" "$MQTT_USERNAME" "$MQTT_PASSWORD" > runtime.env
          scp runtime.env "${AWS_USER}@${AWS_HOST}:/tmp/iot-ai-runtime-${GITHUB_SHA}.env"
          rm -f runtime.env

      - name: Deploy on EC2
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER || 'ec2-user' }}
        run: |
          set -euo pipefail
          ssh "${AWS_USER}@${AWS_HOST}" "SHA=${GITHUB_SHA} bash -s" <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /opt/iot-ai
          sudo tar -xzf "/tmp/iot-ai-deploy-${SHA}.tar.gz" -C /opt/iot-ai
          rm -f "/tmp/iot-ai-deploy-${SHA}.tar.gz"
          sudo install -m 600 "/tmp/iot-ai-runtime-${SHA}.env" /opt/iot-ai/.env
          rm -f "/tmp/iot-ai-runtime-${SHA}.env"
          cd /opt/iot-ai
          sudo docker-compose --env-file .env -f docker-compose.yml -f docker-compose.aws.yml up -d --build --remove-orphans
          sudo docker image prune -f
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1/api/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1/api/status >/dev/null
          REMOTE

      - name: Publish deployment summary
        if: steps.preflight.outputs.ready == 'true'
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: 'echo "Dashboard URL: https://${DOMAIN}" >> "$GITHUB_STEP_SUMMARY"'

      - name: Explain skipped deployment
        if: steps.preflight.outputs.ready != 'true'
        run: echo "Validation passed. Add AWS_HOST, AWS_SSH_PRIVATE_KEY, DOMAIN, POSTGRES_PASSWORD, and ARDUINO_API_KEY to enable EC2 deployment."
